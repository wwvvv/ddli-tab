name: DTab checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0 # Exact pre-M1 worker fixture is read from its audited Git commit.
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4（读取 packageManager 字段）
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: pnpm
      - name: Read deployment Node version
        id: deployment-runtime
        run: |
          node --input-type=module -e '
            import fs from "node:fs";
            const { nodeVersion } = JSON.parse(fs.readFileSync("edgeone.json", "utf8"));
            if (!/^\d+\.\d+\.\d+$/.test(nodeVersion)) throw new Error("Invalid deployment Node version");
            fs.appendFileSync(process.env.GITHUB_OUTPUT, `node=${nodeVersion}\n`);
          '
      - run: pnpm install --frozen-lockfile
      - run: pnpm run build
      - run: pnpm run build:extension
      - run: pnpm run build:web
      - run: npx --yes --package=node@${{ steps.deployment-runtime.outputs.node }} node scripts/check-production.mjs
      - run: pnpm test
      - run: pnpm run test:review
      - run: pnpm run test:origin
      - run: docker pull postgres:17-alpine
      - run: pnpm run test:db
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm run test:e2e
      - run: pnpm run test:e2e:os
      - run: pnpm run test:e2e:integration


