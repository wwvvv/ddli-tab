<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><title>DTab 站点授权</title><link rel="stylesheet" href="popup.css"></head><body>
<h1>DTab 站点授权</h1>
<p>首次连接需允许插件访问你的 DTab 网页。此设置页在浏览器授权提示出现时保持打开。</p>
<label>DTab 网页地址<input id="site" type="url"></label>
<button id="grant">授权此站点</button><p id="status" role="status"></p>
<p>授权完成后，回到想收藏的网页，重新打开 DTab 插件并读取分组。无需填写 Supabase 密钥。</p>
<script type="module" src="connect.js"></script></body></html>
